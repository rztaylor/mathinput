name: Publish

# Publishes the four @mathinput/* packages to npm with provenance when a
# `v<version>` tag is pushed, then creates the GitHub release from the
# changelog. npm trusted publishing (OIDC) authenticates, so there is no npm
# token; see .agents/facts/release.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm
      url: https://www.npmjs.com/org/mathinput
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1
      - name: Tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: node scripts/release-check.mjs "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run check
      - run: npm run lint:packages
      - run: npm run check:pack
      - run: npm run size
      - name: Publish in dependency order
        run: |
          version="${GITHUB_REF_NAME#v}"
          dist_tag=latest
          case "$version" in *-*) dist_tag=next ;; esac
          for pkg in core presets-uk element react; do
            name="@mathinput/$pkg"
            if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "$name@$version is already on npm; skipping"
              continue
            fi
            npm publish -w "$name" --access public --provenance --tag "$dist_tag"
          done

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: node scripts/release-check.mjs "$GITHUB_REF_NAME" --notes "$RUNNER_TEMP/notes.md"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping"
            exit 0
          fi
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" $prerelease
