name: Deploy site

# Publishes the MathInput website (site/) to Cloudflare Pages by Direct Upload.
# Production is the `release` branch; see .agents/facts/cloudflare-pages.md.
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: Live
      url: https://mathinput.rztaylor.uk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:site
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy site/dist --project-name=mathinput --branch=release --commit-hash=${{ github.sha }} --commit-dirty=false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
