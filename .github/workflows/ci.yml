name: CI

# Release checks on every pull request and on main; see .agents/facts/testing.md.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint:packages
      - run: npm run check:pack
      - run: npm run size
      - run: npm run build:site
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: packages/element/test-results/
          retention-days: 7
          if-no-files-found: ignore
